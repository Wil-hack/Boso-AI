<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeoMind AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(20, 25, 40, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg-color); 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%);
            color: var(--text-main); 
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; 
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 20px; text-align: center;
            background: linear-gradient(to bottom, rgba(11,15,25,0.9), transparent);
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
            pointer-events: none;
        }
        header h1 { 
            font-size: 1.4rem; font-weight: 700; 
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        header p { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

        /* Main Container */
        .main-container {
            flex: 1; display: flex; flex-direction: column;
            padding: 80px 15px 20px 15px; /* Top padding untuk header */
            max-width: 600px; margin: 0 auto; width: 100%;
        }

        /* Setup Card */
        .setup-card {
            background: var(--panel-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color); border-radius: 20px;
            padding: 25px; text-align: center; margin-top: auto; margin-bottom: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: fadeIn 0.5s ease-out;
        }
        .icon-container {
            width: 60px; height: 60px; margin: 0 auto 15px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .icon-container svg { width: 30px; height: 30px; stroke: white; }

        .setup-card h2 { font-size: 1.2rem; margin-bottom: 8px; }
        .setup-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }

        .file-input-wrapper {
            position: relative; overflow: hidden; display: inline-block; width: 100%; margin-bottom: 15px;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer;
        }
        .file-btn {
            background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2);
            color: var(--text-main); padding: 15px; border-radius: 12px; width: 100%;
            font-size: 0.9rem; transition: 0.3s; cursor: pointer;
        }
        .file-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); }

        .action-btn {
            background: var(--primary); color: white; border: none; width: 100%;
            padding: 15px; border-radius: 12px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px var(--primary-glow);
        }
        .action-btn:active { transform: scale(0.98); }
        .action-btn:disabled { background: #334155; box-shadow: none; color: #64748b; cursor: not-allowed; }

        .status-text { font-size: 0.8rem; color: #fbbf24; margin-top: 15px; min-height: 20px; }

        /* Chat Area */
        .chat-container {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
            padding-bottom: 10px; scroll-behavior: smooth; display: none; /* Sembunyi awalnya */
        }
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .msg { 
            max-width: 85%; padding: 12px 18px; border-radius: 20px; 
            font-size: 0.95rem; line-height: 1.5; word-wrap: break-word;
            animation: slideUp 0.3s ease-out;
        }
        .msg-user { 
            background: linear-gradient(135deg, var(--primary), #4f46e5); 
            color: white; align-self: flex-end; border-bottom-right-radius: 4px;
            box-shadow: 0 4px 10px rgba(99,102,241,0.2);
        }
        .msg-ai { 
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); color: var(--text-main); 
            align-self: flex-start; border-bottom-left-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Typing Indicator */
        .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 5px 0; }
        .typing-indicator span {
            width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        /* Input Area */
        .input-area {
            display: flex; gap: 10px; background: var(--panel-bg);
            backdrop-filter: blur(16px); border: 1px solid var(--border-color);
            padding: 10px; border-radius: 24px; margin-top: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none;
        }
        .input-area textarea {
            flex: 1; background: transparent; border: none; color: white;
            padding: 10px 15px; font-size: 0.95rem; resize: none; height: 44px; max-height: 120px;
            outline: none;
        }
        .input-area textarea::placeholder { color: var(--text-muted); }
        
        .btn-send {
            background: var(--primary); border: none; width: 44px; height: 44px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px var(--primary-glow);
        }
        .btn-send:disabled { background: #334155; box-shadow: none; cursor: not-allowed; }
        .btn-send svg { width: 18px; height: 18px; stroke: white; margin-left: -2px; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <h1>NeoMind AI</h1>
        <p>Local & Private Intelligence</p>
    </header>

    <div class="main-container">
        
        <!-- Setup Area -->
        <div class="setup-card" id="setup-card">
            <div class="icon-container">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path><path d="M12 12 2.1 12.1"></path><path d="M12 12 18.5 18.5"></path></svg>
            </div>
            <h2>Aktifkan Otak AI</h2>
            <p>Pilih file model <b>.gguf</b> dari HP kamu untuk memulai. Semua data diproses secara lokal tanpa internet.</p>
            
            <div class="file-input-wrapper">
                <div class="file-btn" id="file-label">📂 Ketuk untuk memilih file .gguf</div>
                <input type="file" id="model-file" accept=".gguf" onchange="updateFileName()">
            </div>
            
            <button class="action-btn" id="load-btn" onclick="loadModel()">Muat Model ke RAM</button>
            <div class="status-text" id="status">Status: Siap menerima file.</div>
        </div>

        <!-- Chat Area -->
        <div class="chat-container" id="chat-container"></div>

        <!-- Input Area -->
        <div class="input-area" id="input-area">
            <textarea id="user-input" placeholder="Tanyakan sesuatu..." disabled onkeypress="handleEnter(event)" rows="1"></textarea>
            <button class="btn-send" id="send-btn" onclick="sendMsg()" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <!-- Library wllama -->
    <script src="https://cdn.jsdelivr.net/npm/@wllama/wllama@2.1.0/esm/index.js"></script>
    
    <script>
        let wllama = null;
        let isGenerating = false;

        // Update nama file saat dipilih
        function updateFileName() {
            const fileInput = document.getElementById('model-file');
            const label = document.getElementById('file-label');
            if (fileInput.files.length > 0) {
                const fileName = fileInput.files[0].name;
                label.innerText = "✅ " + (fileName.length > 25 ? fileName.substring(0, 22) + "..." : fileName);
                label.style.color = "#10b981";
                label.style.borderColor = "#10b981";
            }
        }

        async function loadModel() {
            const fileInput = document.getElementById('model-file');
            const status = document.getElementById('status');
            const loadBtn = document.getElementById('load-btn');

            if (!fileInput.files.length) {
                status.innerText = "⚠️ Pilih file .gguf terlebih dahulu!";
                status.style.color = "#ef4444";
                return;
            }

            status.innerText = "⏳ Memuat model ke RAM... (Butuh waktu)";
            status.style.color = "#38bdf8";
            loadBtn.disabled = true;
            loadBtn.innerText = "Memproses...";

            try {
                wllama = new Wllama.Wllama();
                const file = fileInput.files[0];
                
                await wllama.loadModel([file], {
                    n_ctx: 1024,
                    n_threads: navigator.hardwareConcurrency || 4
                });

                // Animasi transisi
                const setupCard = document.getElementById('setup-card');
                setupCard.style.opacity = '0';
                
                setTimeout(() => {
                    setupCard.style.display = 'none';
                    document.getElementById('chat-container').style.display = 'flex';
                    document.getElementById('input-area').style.display = 'flex';
                    
                    document.getElementById('user-input').disabled = false;
                    document.getElementById('send-btn').disabled = false;
                    
                    // Pesan sambutan
                    tambahPesan("Halo! Saya NeoMind, asisten AI yang berjalan sepenuhnya di perangkatmu. Apa yang ingin kamu pelajari hari ini?", 'ai');
                }, 300);

            } catch (error) {
                console.error(error);
                status.innerText = "❌ Gagal memuat. Pastikan RAM mencukupi.";
                status.style.color = "#ef4444";
                loadBtn.disabled = false;
                loadBtn.innerText = "Coba Lagi";
            }
        }

        function tambahPesan(teks, pengirim) {
            const chatBox = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `msg msg-${pengirim}`;
            
            // Cek jika ini indikator typing
            if (teks === 'TYPING') {
                div.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
                div.id = 'typing-bubble';
            } else {
                div.innerText = teks;
            }
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMsg();
            }
        }

        async function sendMsg() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();

            if (!text || isGenerating || !wllama) return;

            tambahPesan(text, 'user');
            input.value = '';
            input.style.height = '44px'; // Reset tinggi textarea
            
            // Tampilkan indikator AI sedang mengetik
            const typingBubble = tambahPesan('TYPING', 'ai');
            
            isGenerating = true;
            document.getElementById('send-btn').disabled = true;

            try {
                const prompt = `<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
                let fullResponse = "";
                let isFirstChunk = true;
                
                await wllama.createCompletion(prompt, {
                    nPredict: 256,
                    onData: (chunk) => {
                        if (isFirstChunk) {
                            // Hapus indikator typing saat kata pertama muncul
                            typingBubble.remove();
                            var aiBubble = tambahPesan("", 'ai');
                            isFirstChunk = false;
                        }
                        fullResponse += chunk;
                        aiBubble.innerText = fullResponse;
                        document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
                    }
                });
            } catch (error) {
                if (typingBubble) typingBubble.remove();
                tambahPesan("Maaf, terjadi kesalahan saat memproses jawaban.", 'ai');
            } finally {
                isGenerating = false;
                document.getElementById('send-btn').disabled = false;
                input.focus();
            }
        }

        // Auto-resize textarea
        const textarea = document.getElementById('user-input');
        textarea.addEventListener('input', function() {
            this.style.height = '44px';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
</body>
</html>
